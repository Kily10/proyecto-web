<header> 
  <img src="logo.png" class="logo">

  <div>
    <h1>FILTROPARTS</h1>
    <p>Cursos de Mecánica</p>
  </div>

  <nav>
    <ul>
      <li><a routerLink="/home">Inicio</a></li>
      <li><a routerLink="/contact">Contacto</a></li>
      <li><a routerLink="/menu">Menú</a></li>
    </ul>
  </nav>
</header>

<div class="container">

  <div class="images">
    <img src="assets/filtros.jpg">
    <img src="assets/mec.jpg">
  </div>
  
  <div class="login-box">
    <h2>Iniciar Sesión</h2>

    <div class="field">
      <span class="icon">@</span>
      <input 
        [(ngModel)]="email" 
        type="email"
        placeholder="Correo"
        required
      >
    </div>

    <div class="field">
      <span class="icon">🔒</span>
      <input 
        [(ngModel)]="password" 
        type="password" 
        placeholder="Contraseña"
        required
      >
    </div>

    <button (click)="login()">Ingresar</button>

    <p class="extra">¿Olvidaste tu contraseña?</p>
  </div>

</div>
