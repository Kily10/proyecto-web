<div class="cursos">

  <h1>📚 Todos los Cursos</h1>

  <div class="grid">

    <div class="card" *ngFor="let curso of cursos">

      <div class="emoji">
        {{ curso.emoji || '📘' }}
      </div>

      <h3>
        {{ curso.titulo || 'Curso sin título' }}
      </h3>

      <p>
        {{ curso.descripcion || 'Sin descripción' }}
      </p>

      <div class="info">

        <span>
          ⭐ {{ curso.rating || 5 }}
        </span>

        <span>
          💰 ${{ curso.precio || 0 }}
        </span>

      </div>

      <p>
        🔒 {{ curso.nivel || 'Gratis' }}
      </p>

      <button (click)="entrarCurso(curso)">
        Entrar al Curso →
      </button>

    </div>

  </div>

</div>
