```html
<div class="cursos">

  <h1>📚 Todos los Cursos</h1>

  <div class="grid">

    <div class="card" *ngFor="let curso of cursos">

      <div class="emoji">
        {{ curso.emoji || '📘' }}
      </div>

      <h3>
        {{ curso.titulo || 'Curso sin título' }}
      </h3>

      <p>
        {{ curso.descripcion || 'Sin descripción' }}
      </p>

      <div class="info">

        <span>
          ⭐ {{ curso.rating || 5 }}
        </span>

        <span>
          💰 ${{ curso.precio || 0 }}
        </span>

      </div>

      <p>
        🔒 {{ curso.nivel || 'Gratis' }}
      </p>

      <button
        class="btn-curso"
        [class.bloqueado]="!puedeAcceder(curso.nivel)"
        (click)="entrarCurso(curso)"
      >

        <span *ngIf="puedeAcceder(curso.nivel)">
          Entrar al Curso →
        </span>

        <span *ngIf="!puedeAcceder(curso.nivel)">
          🔒 Curso Bloqueado
        </span>

      </button>

    </div>

  </div>

</div>
```
