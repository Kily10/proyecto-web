<div class="admin-container">

  <div class="admin-header">
    <h1>⚙ Panel Administrador</h1>
    <p>Gestiona cursos premium de EduFlow</p>
  </div>

  <!-- FORMULARIO -->
  <div class="form-card">

    <h2>➕ Crear Nuevo Curso</h2>

    <div class="form-grid">

      <input
        [(ngModel)]="titulo"
        placeholder="📘 Título del curso"
      >

      <input
        [(ngModel)]="categoria"
        placeholder="📂 Categoría"
      >

      <textarea
        [(ngModel)]="descripcion"
        placeholder="📝 Descripción del curso"
      ></textarea>

      <select [(ngModel)]="nivel">

        <option value="Platino">
          🥈 Platino
        </option>

        <option value="Gold">
          🥇 Gold
        </option>

        <option value="Diamante">
          💎 Diamante
        </option>

      </select>

      <input
        [(ngModel)]="emoji"
        placeholder="😀 Emoji"
      >

      <input
        type="number"
        [(ngModel)]="precio"
        placeholder="💰 Precio"
      >

      <input
        type="number"
        [(ngModel)]="rating"
        placeholder="⭐ Rating"
      >

    </div>

    <button class="crear-btn" (click)="crearCurso()">
      ✨ Crear Curso
    </button>

  </div>

  <!-- LISTA CURSOS -->
  <div class="cursos-section">

    <h2>📚 Cursos Registrados</h2>

    <div class="cards-grid">

      <div class="curso-card" *ngFor="let c of cursos">

        <div class="emoji">
          {{ c.emoji || '📘' }}
        </div>

        <h3>{{ c.titulo }}</h3>

        <p class="descripcion">
          {{ c.descripcion }}
        </p>

        <div class="tags">

          <span class="categoria">
            📂 {{ c.categoria }}
          </span>

          <span class="nivel">
            🔒 {{ c.nivel }}
          </span>

        </div>

        <div class="bottom">

          <span class="precio">
            💰 ${{ c.precio }}
          </span>

          <span class="rating">
            ⭐ {{ c.rating }}
          </span>

        </div>

        <button
          class="delete-btn"
          (click)="eliminarCurso(c.id)"
        >
          🗑 Eliminar
        </button>

      </div>

    </div>

  </div>

</div>
