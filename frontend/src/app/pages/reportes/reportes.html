<div class="reportes">

  <h1>📊 Reportes</h1>

  <!-- 💰 INGRESOS -->
  <div class="box">

    <h2>💰 Ingresos</h2>

    <canvas id="chartIngresos"></canvas>

    <div *ngFor="let i of ingresos" class="card">
      <p>Plan: {{ i.plan }}</p>
      <p>Usuarios: {{ i.total }}</p>
      <p>Ingresos: ${{ i.ingresos }}</p>
    </div>

  </div>

  <!-- 🔥 CURSOS -->
  <div class="box">

    <h2>🔥 Cursos más inscritos</h2>

    <canvas id="chartCursos"></canvas>

    <div *ngFor="let c of cursos" class="card">
      <p>{{ c.accion }}</p>
      <p>Total: {{ c.total }}</p>
    </div>

  </div>

  <!-- 👥 USUARIOS -->
  <div class="box">

    <h2>👥 Usuarios</h2>

    <canvas id="chartUsuarios"></canvas>

    <div class="card">
      <p>Activos: {{ usuarios?.activos }}</p>
      <p>Inactivos: {{ usuarios?.inactivos }}</p>
    </div>

  </div>

</div>
