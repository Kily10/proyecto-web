<div class="historial">

  <h1>📊 Mi Historial</h1>

  <!-- DEBUG -->
  <p>Total registros: {{ historial.length }}</p>

  <div *ngIf="historial.length === 0">
    📭 Sin registros
  </div>

  <div *ngFor="let h of historial" class="card">

    <p><strong>📝</strong> {{ h.accion }}</p>
    <p><strong>📅</strong> {{ h.created_at }}</p>

  </div>

</div>
