<div *ngIf="!curso"
     style="
     color:white;
     background:#0f172a;
     min-height:100vh;
     padding:40px;
     font-family:Poppins;
     ">
     
  Cargando curso...

</div>

<div class="curso" *ngIf="curso">

  <!-- 🔙 VOLVER -->
  <button class="back" routerLink="/home">
    ⬅ Volver
  </button>

  <!-- 📘 HEADER -->
  <div class="curso-header">

    <div class="info">

      <h1>{{ curso.titulo }}</h1>

      <p>
        {{ curso.descripcion }}
      </p>

      <div class="meta">

        <span>
          ⭐ {{ curso.rating }}
        </span>

        <span *ngIf="curso.precio === 0">
          Gratis
        </span>

        <span *ngIf="curso.precio > 0">
          ${{ curso.precio }}
        </span>

      </div>

      <!-- 🔒 NIVEL -->
      <p class="nivel">
        🔒 Nivel: {{ curso.nivel }}
      </p>

      <!-- 🔘 BOTÓN -->
      <button
        class="btn-primary"
        [disabled]="!puedeAcceder()"
        (click)="inscribirse()"
      >

        {{
          puedeAcceder()
          ? 'Inscribirse'
          : '🔒 Plan insuficiente'
        }}

      </button>

    </div>

    <!-- 📚 MATERIAL -->
    <div class="material">

      <h2>
        📚 Material del curso
      </h2>

      <ul>

        <li *ngFor="let tema of curso.temas">
          ▶ {{ tema }}
        </li>

      </ul>

    </div>

    <!-- 🔥 EMOJI -->
    <div class="emoji">
      📚
    </div>

  </div>

  <!-- 🎬 MEDIA -->
  <div class="media-box">

    <!-- 🖼 IMAGEN -->
    <img
      *ngIf="curso.imagen"
      [src]="curso.imagen"
      class="curso-img"
    >

    <!-- 🎥 VIDEO -->
    <video
      *ngIf="curso.video"
      controls
      class="curso-video"
    >

      <source
        [src]="curso.video"
        type="video/mp4"
      >

    </video>

  </div>

  <!-- 📖 CONTENIDO -->
  <div class="contenido">

    <h2>
      📖 Contenido del curso
    </h2>

    <ul>

      <li *ngFor="let tema of curso.temas">
        ✔ {{ tema }}
      </li>

    </ul>

  </div>

</div>
