<div class="curso" *ngIf="curso">

  <!-- 🔙 VOLVER -->
  <button class="back" routerLink="/home">⬅ Volver</button>

  <!-- 📘 HEADER -->
  <div class="curso-header">

    <div class="info">
      <h1>{{ curso.titulo }}</h1>
      <p>{{ curso.descripcion }}</p>

      <div class="meta">
        ⭐ {{ curso.rating }}
        <span *ngIf="curso.precio === 0">Gratis</span>
        <span *ngIf="curso.precio > 0">${{ curso.precio }}</span>
      </div>

      <!-- 🔐 NIVEL -->
      <p class="nivel">Nivel: {{ curso.nivel }}</p>

      <!-- 🔒 BOTÓN CONTROLADO -->
      <button 
        class="btn-primary"
        [disabled]="!puedeAcceder()"
        (click)="inscribirse()"
      >
        {{ puedeAcceder() ? 'Inscribirse' : '🔒 Plan insuficiente' }}
      </button>
    </div>

    <!-- 📚 MATERIAL -->
    <div class="material">
      <h2>📚 Material del curso</h2>
      <ul>
        <li *ngFor="let tema of curso.temas">
          ▶ {{ tema }}
        </li>
      </ul>
    </div>

    <!-- 🔥 EMOJI FIJO (porque BD no tiene) -->
    <div class="emoji">
      📚
    </div>

  </div>

  <!-- 📚 CONTENIDO -->
   <div class="contenido">
      <h2>Contenido del curso</h2>

      <ul>
       <li *ngFor="let tema of curso.temas">
        ✔ {{ tema }}
       </li>
      </ul>
   </div>

</div>
