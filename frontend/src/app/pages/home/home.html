<div class="home">

  <!-- 🔝 NAVBAR -->
  <header class="navbar">
    <div class="logo">EduFlow</div>

    <nav class="menu">
      <a routerLink="/home">Inicio</a>
      <a routerLink="/cursos">Cursos</a>
      <a routerLink="/historial">Historial</a>
    </nav>

    <div class="actions">
      <button class="btn-outline">Perfil</button>
      <button class="btn-danger" (click)="logout()">Salir</button>
    </div>
  </header>

  <!-- 🚀 HERO -->
  <section class="hero">
    <h1>Aprende nuevas habilidades 🚀</h1>
    <p>Explora cursos de programación, diseño y tecnología</p>

    <div class="search">
      <input 
        type="text" 
        placeholder="Buscar cursos..."
        (input)="search($event)"
      >
    </div>
  </section>

  <!-- 📚 CATEGORÍAS -->
  <section class="categories">
    <button (click)="filter('all')" class="active">Todos</button>
    <button (click)="filter('programacion')">Programación</button>
    <button (click)="filter('data')">Data Science</button>
    <button (click)="filter('diseno')">Diseño</button>
  </section>

  <!-- 📦 CURSOS -->
  <section class="courses">

    <div class="card" *ngFor="let curso of cursos">

      <div class="emoji">
        {{ curso.emoji }}
      </div>

      <h3>{{ curso.titulo }}</h3>

      <p>{{ curso.descripcion }}</p>

      <div class="info">
        ⭐ {{ curso.rating }}
        <span *ngIf="curso.precio === 0">Gratis</span>
        <span *ngIf="curso.precio > 0">${{ curso.precio }}</span>
      </div>

      <button class="btn-primary" (click)="verCurso(curso)">
        Ver Curso
      </button>

    </div>

  </section>

</div>
